name: security

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # asn1core is not on an index yet (see pyproject.toml), so it is installed from its repository.
      # When it publishes, this step and the sibling paths in pyproject.toml come out together.
      - uses: actions/checkout@v4
        with:
          repository: b1tninja/asn1core
          path: .deps/asn1core
      - run: python -m pip install --no-deps .deps/asn1core
      # sigwire[verify] (the verify-only signatures, formerly sigprim) is an unpublished sibling too;
      # cryptography arrives through this project's own dependencies, so --no-deps is enough.
      - uses: actions/checkout@v4
        with:
          repository: b1tninja/sigwire
          path: .deps/sigwire
      - run: python -m pip install --no-deps .deps/sigwire
      - run: python -m pip install -e ".[dev]" pip-audit
      # The resolved environment is audited rather than the declarations, because the
      # declarations are floors. A file is written by a script rather than shell
      # redirection so the step behaves identically on a self-hosted runner.
      - run: python tools/write_freeze.py requirements-audit.txt
      # The audit reads the versions already installed above and installs nothing itself:
      # --no-deps and --disable-pip stop pip-audit from resolving the list in a fresh
      # environment, which is how it used to end up cloning a repository instead of auditing.
      - run: python -m pip_audit --progress-spinner off --no-deps --disable-pip -r requirements-audit.txt
